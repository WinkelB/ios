# Fork-only helper: builds an unsigned IPA for sideloading. Not meant for upstream.
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      xcode-version:
        description: 'Xcode version for setup-xcode (upstream CI uses 27.1)'
        default: '27.1'
        required: false
  push:
    branches:
      - fix/mtls-client-certificate

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Mock GoogleService-Info.plist (same as upstream CI)
        run: curl -sSL "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -o GoogleService-Info.plist

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '27.1' }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Archive without code signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Nextcloud.xcodeproj \
            -scheme Nextcloud \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Nextcloud.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | xcbeautify --quieter

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Nextcloud.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry Nextcloud-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Nextcloud-unsigned-ipa
          path: build/Nextcloud-unsigned.ipa
          retention-days: 7
